<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="100%" height="100%">
  <defs>
    <linearGradient id="qilGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="80%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="qilMane" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>
    <filter id="qilGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#qilGlow)">
    <!-- Auspicious Swirling Clouds under Hooves (Tường Vân Tụ Khí) -->
    <path d="M 35 200 C 20 185 45 165 70 180 C 85 160 115 170 120 195 C 95 210 55 215 35 200 Z" fill="#c084fc" opacity="0.4" />
    <path d="M 175 195 C 160 175 190 160 215 175 C 235 155 265 170 270 195 C 245 210 205 215 175 195 Z" fill="#fde047" opacity="0.35" />

    <!-- Tail (Đuôi Kỳ Lân Tỏa Sáng Như Lửa) -->
    <g transform="translate(60, 115)">
      <path d="M0,0 C-25,-10 -40,-5 -50,15 C-40,25 -25,20 -15,10 Z" fill="url(#qilMane)" />
      <path d="M-15,10 C-35,15 -55,40 -45,60 C-30,55 -25,35 -5,25 Z" fill="url(#qilMane)" />
    </g>

    <!-- Rear Legs -->
    <g stroke="url(#qilGold)" stroke-width="12" stroke-linecap="round" fill="none">
      <!-- Back Left Leg -->
      <path d="M 85 130 L 75 165 L 85 195" />
      <!-- Back Right Leg -->
      <path d="M 110 135 L 105 165 L 115 195" stroke-width="10" opacity="0.8" />
    </g>
    <!-- Golden Hooves (Móng Guốc Vàng) -->
    <rect x="78" y="193" width="14" height="8" rx="3" fill="#fef08a" />
    <rect x="109" y="193" width="12" height="7" rx="3" fill="#fde047" />

    <!-- Qilin Scaled Body (Thân Mình Vảy Rồng) -->
    <path d="M 80 125 C 80 100 110 90 150 95 C 190 100 205 115 200 145 C 170 155 120 155 80 125 Z" fill="url(#qilGold)" />
    <!-- Scales Overlay -->
    <path d="M 100 115 Q 115 130 130 115 Q 145 130 160 115 M 110 130 Q 125 145 140 130 Q 155 145 170 130" stroke="#fef08a" stroke-width="2" fill="none" opacity="0.8" />

    <!-- Front Legs -->
    <g stroke="url(#qilGold)" stroke-width="12" stroke-linecap="round" fill="none">
      <!-- Front Left Leg (Stepping forward) -->
      <path d="M 185 130 L 200 160 L 195 190" />
      <!-- Front Right Leg -->
      <path d="M 165 130 L 175 160 L 170 190" stroke-width="10" opacity="0.8" />
    </g>
    <!-- Front Hooves -->
    <rect x="188" y="188" width="14" height="8" rx="3" fill="#fef08a" />
    <rect x="164" y="188" width="12" height="7" rx="3" fill="#fde047" />

    <!-- Radiant Neck and Chest -->
    <path d="M 180 125 C 190 105 200 80 215 65 C 225 75 220 105 200 135 Z" fill="url(#qilGold)" />

    <!-- Fiery Mane along Neck and Spine -->
    <g fill="url(#qilMane)">
      <polygon points="175,95 160,80 180,85" />
      <polygon points="185,80 170,62 192,70" />
      <polygon points="198,68 185,48 208,55" />
      <polygon points="210,55 200,32 220,42" />
    </g>

    <!-- Dragon-Lion Head (Đầu Lân Uy Nghiêm) -->
    <g transform="translate(225, 55)">
      <!-- Antler / Horn (Sừng Lân Đơn hoặc Kép Phát Sáng) -->
      <path d="M-5,-10 C-2,-30 8,-42 18,-50 C14,-38 10,-28 5,-15 Z" fill="url(#qilMane)" stroke="#b45309" stroke-width="1.5" />
      <circle cx="18" cy="-50" r="4" fill="#fde047" />

      <!-- Head Base -->
      <ellipse cx="0" cy="0" rx="16" ry="12" fill="url(#qilGold)" />
      <!-- Snout and Whiskers -->
      <path d="M8,-5 C18,-8 28,0 26,10 C20,15 10,12 5,6 Z" fill="url(#qilGold)" />
      <!-- Flowing Beard (Râu Lân) -->
      <path d="M12,12 C15,25 5,35 -5,40 C0,30 5,22 8,12 Z" fill="url(#qilMane)" />

      <!-- Sparkling Eye -->
      <circle cx="6" cy="-2" r="3.5" fill="#7c3aed" />
      <circle cx="7" cy="-3" r="1.5" fill="#fef08a" />
      <circle cx="5" cy="-1" r="1" fill="#ffffff" />
    </g>
  </g>
</svg>