<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#451a03" stop-opacity="1"/>
      <stop offset="60%" stop-color="#1c1917" stop-opacity="1"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="1"/>
    </radialGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="25%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="75%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Soft Gold Gradient -->
    <linearGradient id="goldLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#fef9c3"/>
    </linearGradient>

    <!-- Yin (Dark Night & Mystic Indigo) -->
    <linearGradient id="yinGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Yang (Celestial Solar Light) -->
    <linearGradient id="yangGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="40%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
    </filter>

    <!-- Glow Filter -->
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Circle Frame with Dark Mystic Fill -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGlow)" stroke="url(#goldGradient)" stroke-width="8" filter="url(#shadow)"/>

  <!-- Outer 12 Rays / Zodiac Celestial Markers -->
  <g stroke="url(#goldGradient)" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <line x1="256" y1="20" x2="256" y2="42"/>
    <line x1="256" y1="470" x2="256" y2="492"/>
    <line x1="20" y1="256" x2="42" y2="256"/>
    <line x1="470" y1="256" x2="492" y2="256"/>

    <line x1="89" y1="89" x2="105" y2="105"/>
    <line x1="407" y1="407" x2="423" y2="423"/>
    <line x1="89" y1="423" x2="105" y2="407"/>
    <line x1="407" y1="105" x2="423" y2="89"/>

    <line x1="147" y1="42" x2="158" y2="61"/>
    <line x1="365" y1="42" x2="354" y2="61"/>
    <line x1="147" y1="470" x2="158" y2="451"/>
    <line x1="365" y1="470" x2="354" y2="451"/>

    <line x1="42" y1="147" x2="61" y2="158"/>
    <line x1="42" y1="365" x2="61" y2="354"/>
    <line x1="470" y1="147" x2="451" y2="158"/>
    <line x1="470" y1="365" x2="451" y2="354"/>
  </g>

  <!-- Decorative Astrolabe Ring -->
  <circle cx="256" cy="256" r="218" fill="none" stroke="url(#goldGradient)" stroke-width="2" stroke-dasharray="6,4" opacity="0.6"/>
  <circle cx="256" cy="256" r="206" fill="none" stroke="url(#goldGradient)" stroke-width="3" opacity="0.8"/>

  <!-- 8 Trigram (Bát Quái) Golden Geometric Badges around circle -->
  <g fill="url(#goldGradient)" opacity="0.85">
    <!-- Càn (Nam / Trời - 3 vạch liền ☰) -->
    <rect x="244" y="58" width="24" height="3" rx="1.5"/>
    <rect x="244" y="65" width="24" height="3" rx="1.5"/>
    <rect x="244" y="72" width="24" height="3" rx="1.5"/>

    <!-- Khôn (Bắc / Đất - 3 vạch đứt ☷) -->
    <rect x="244" y="438" width="10" height="3" rx="1.5"/>
    <rect x="258" y="438" width="10" height="3" rx="1.5"/>
    <rect x="244" y="445" width="10" height="3" rx="1.5"/>
    <rect x="258" y="445" width="10" height="3" rx="1.5"/>
    <rect x="244" y="452" width="10" height="3" rx="1.5"/>
    <rect x="258" y="452" width="10" height="3" rx="1.5"/>

    <!-- Ly (Đông / Lửa ☲) -->
    <rect x="438" y="244" width="3" height="24" rx="1.5"/>
    <rect x="445" y="244" width="3" height="10" rx="1.5"/>
    <rect x="445" y="258" width="3" height="10" rx="1.5"/>
    <rect x="452" y="244" width="3" height="24" rx="1.5"/>

    <!-- Khảm (Tây / Nước ☵) -->
    <rect x="58" y="244" width="3" height="10" rx="1.5"/>
    <rect x="58" y="258" width="3" height="10" rx="1.5"/>
    <rect x="65" y="244" width="3" height="24" rx="1.5"/>
    <rect x="72" y="244" width="3" height="10" rx="1.5"/>
    <rect x="72" y="258" width="3" height="10" rx="1.5"/>
  </g>

  <!-- 8-Pointed Star of Purple Star Astrology (Tử Vi Tinh Diệu) -->
  <g fill="url(#goldLight)" opacity="0.45">
    <polygon points="256,76 266,236 436,256 266,276 256,436 246,276 76,256 246,236"/>
    <polygon points="256,110 263,243 392,256 263,269 256,402 249,269 120,256 249,243" transform="rotate(45 256 256)"/>
  </g>

  <!-- Inner Taiji / Yin-Yang Disc -->
  <g filter="url(#goldGlow)">
    <!-- Base Taiji Ring -->
    <circle cx="256" cy="256" r="148" fill="none" stroke="url(#goldGradient)" stroke-width="7"/>
    <circle cx="256" cy="256" r="145" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.6"/>

    <!-- Taiji Body -->
    <g id="taiji">
      <!-- Dark Half (Yin) -->
      <path d="M 256,111 
               A 145,145 0 0,1 256,401 
               A 72.5,72.5 0 0,1 256,256 
               A 72.5,72.5 0 0,0 256,111 Z" 
            fill="url(#yinGradient)" stroke="url(#goldGradient)" stroke-width="1.5"/>

      <!-- Light Half (Yang) -->
      <path d="M 256,401 
               A 145,145 0 0,1 256,111 
               A 72.5,72.5 0 0,1 256,256 
               A 72.5,72.5 0 0,0 256,401 Z" 
            fill="url(#yangGradient)" stroke="url(#goldGradient)" stroke-width="1.5"/>

      <!-- Light Dot in Yin (Eyes of Taiji) -->
      <circle cx="256" cy="183.5" r="22" fill="url(#yangGradient)" stroke="url(#goldGradient)" stroke-width="2"/>
      <circle cx="256" cy="183.5" r="7" fill="#fff"/>

      <!-- Dark Dot in Yang (Eyes of Taiji) -->
      <circle cx="256" cy="328.5" r="22" fill="url(#yinGradient)" stroke="url(#goldGradient)" stroke-width="2"/>
      <circle cx="256" cy="328.5" r="7" fill="#fde047"/>
    </g>
  </g>

  <!-- Subtle Sparkling North Star (Tử Vi Đế Tinh) at center -->
  <circle cx="256" cy="256" r="3" fill="#fff" filter="url(#goldGlow)"/>
</svg>
