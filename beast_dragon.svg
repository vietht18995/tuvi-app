<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" width="100%" height="100%">
  <defs>
    <linearGradient id="dragGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="dragFlame" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>
    <filter id="dragGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#dragGlow)">
    <!-- Flaming Pearl (Hỏa Châu) -->
    <g transform="translate(30, 70)">
      <circle cx="0" cy="0" r="14" fill="url(#dragFlame)" />
      <circle cx="-3" cy="-3" r="6" fill="#ffffff" opacity="0.8" />
      <path d="M-15,-5 C-25,-15 -25,15 -15,5 M15,-5 C25,-15 25,15 15,5 M-5,-15 C-15,-25 15,-25 5,-15 M-5,15 C-15,25 15,25 5,15" stroke="#fde047" stroke-width="2.5" fill="none" stroke-linecap="round" />
    </g>

    <!-- Dragon Body (Undulating S-curves) -->
    <!-- Spine dorsal flames -->
    <path d="M 60 90 Q 90 40 130 65 Q 160 85 190 60 Q 230 30 270 70 Q 300 100 330 85" fill="none" stroke="url(#dragFlame)" stroke-width="18" stroke-linecap="round" opacity="0.85" />
    
    <!-- Main Body Trunk -->
    <path d="M 65 95 C 95 45 130 75 160 80 C 190 85 220 45 260 65 C 295 85 315 110 335 90" fill="none" stroke="url(#dragGold)" stroke-width="24" stroke-linecap="round" />
    
    <!-- Body Belly (Inner Segments) -->
    <path d="M 68 99 C 98 52 130 80 160 85 C 190 90 220 52 260 70 C 292 90 312 114 332 94" fill="none" stroke="#fef08a" stroke-width="12" stroke-linecap="round" stroke-dasharray="6,4" />

    <!-- Scales Texture Pattern Overlay -->
    <path d="M 75 92 Q 105 55 140 75 Q 175 95 210 65 Q 245 45 285 75" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="3,3" opacity="0.7" />

    <!-- Dorsal Fin Spines (Gai Lưng Rồng) -->
    <g fill="url(#dragFlame)">
      <polygon points="100,50 108,35 115,55" />
      <polygon points="120,55 129,38 136,60" />
      <polygon points="145,70 155,50 162,75" />
      <polygon points="180,68 190,45 198,68" />
      <polygon points="210,48 220,28 228,52" />
      <polygon points="240,45 250,25 258,50" />
      <polygon points="275,65 288,45 293,72" />
    </g>

    <!-- Claws (Móng Vuốt Rồng) -->
    <!-- Front Claws -->
    <g transform="translate(100, 95)" stroke="url(#dragGold)" stroke-width="5" stroke-linecap="round" fill="none">
      <path d="M0,0 L-15,20 L-25,25 M-15,20 L-20,32 M-15,20 L-10,32" />
      <!-- Sharp Golden Nails -->
      <polygon points="-25,25 -32,27 -24,22" fill="#fef08a" stroke="none" />
      <polygon points="-20,32 -24,39 -17,32" fill="#fef08a" stroke="none" />
      <polygon points="-10,32 -11,40 -6,31" fill="#fef08a" stroke="none" />
    </g>
    <!-- Rear Claws -->
    <g transform="translate(240, 80)" stroke="url(#dragGold)" stroke-width="5" stroke-linecap="round" fill="none">
      <path d="M0,0 L10,25 L5,38 M10,25 L18,36 M10,25 L24,30" />
      <polygon points="5,38 2,46 9,39" fill="#fef08a" stroke="none" />
      <polygon points="18,36 19,45 23,36" fill="#fef08a" stroke="none" />
      <polygon points="24,30 33,33 25,26" fill="#fef08a" stroke="none" />
    </g>

    <!-- Tail Tufts (Đuôi Rồng Lượn Sóng) -->
    <g transform="translate(330, 85)" fill="url(#dragFlame)">
      <path d="M0,0 C15,-10 30,5 25,25 C15,20 10,15 0,0 Z" />
      <path d="M0,0 C20,-2 28,-18 20,-28 C10,-18 5,-8 0,0 Z" />
      <path d="M0,0 C25,5 35,-5 30,-12 C18,-5 10,-2 0,0 Z" />
    </g>

    <!-- Dragon Head (Đầu Rồng Uy Dũng) -->
    <g transform="translate(60, 92)">
      <!-- Main Jaw & Snout -->
      <path d="M0,0 C-10,-5 -25,-12 -38,-8 C-45,-5 -48,5 -42,12 C-32,18 -15,14 -5,8 Z" fill="url(#dragGold)" />
      <!-- Lower Jaw -->
      <path d="M-8,10 C-18,18 -32,20 -40,14 C-35,22 -20,24 -5,14 Z" fill="url(#dragGold)" />
      <!-- Teeth -->
      <polygon points="-38,-4 -36,2 -34,-3" fill="#ffffff" />
      <polygon points="-42,10 -38,4 -36,11" fill="#ffffff" />
      <polygon points="-32,15 -28,8 -26,14" fill="#ffffff" />

      <!-- Glowing Eye -->
      <ellipse cx="-24" cy="-3" rx="5" ry="4" fill="#ef4444" />
      <ellipse cx="-25" cy="-3" rx="2" ry="3" fill="#fef08a" />
      <circle cx="-26" cy="-4" r="1" fill="#ffffff" />

      <!-- Horns (Gạc Rồng Vàng) -->
      <path d="M-5,-8 C5,-25 15,-35 28,-38 C22,-30 15,-20 8,-12 C18,-22 28,-24 35,-25 C25,-18 15,-10 5,-4" fill="url(#dragFlame)" stroke="#b45309" stroke-width="1.5" />
      
      <!-- Whiskers (Râu Rồng Bay Bổng) -->
      <path d="M-36,2 C-55,-5 -70,15 -85,10" fill="none" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round" />
      <path d="M-36,8 C-50,20 -65,10 -80,28" fill="none" stroke="#fde047" stroke-width="2" stroke-linecap="round" />

      <!-- Mane (Bờm Rồng Lửa) -->
      <path d="M-5,-10 C5,-18 15,-12 18,-2 C22,-10 30,-5 28,8 C22,6 18,12 10,12" fill="url(#dragFlame)" opacity="0.9" />
    </g>
  </g>
</svg>