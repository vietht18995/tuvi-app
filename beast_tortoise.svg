<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="100%" height="100%">
  <defs>
    <linearGradient id="tortShell" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="30%" stop-color="#059669" />
      <stop offset="70%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="tortGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#92400e" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <linearGradient id="serpentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <filter id="tortGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#tortGlow)">
    <!-- Auspicious Water/Cloud Waves under the Tortoise -->
    <path d="M 30 180 Q 75 160 120 185 Q 165 210 210 180 Q 255 150 290 180" fill="none" stroke="#67e8f9" stroke-width="4" stroke-dasharray="8,6" opacity="0.75" />
    <path d="M 50 195 Q 95 180 140 200 Q 185 220 230 195" fill="none" stroke="#a7f3d0" stroke-width="3" opacity="0.6" />

    <!-- Flippers / Legs -->
    <!-- Front Left Flipper -->
    <path d="M 90 90 C 60 70 30 75 15 95 C 10 115 35 125 75 110 Z" fill="url(#tortGold)" stroke="#b45309" stroke-width="2" />
    <!-- Rear Left Flipper -->
    <path d="M 85 150 C 55 160 40 180 45 195 C 55 205 75 200 95 175 Z" fill="url(#tortGold)" stroke="#b45309" stroke-width="2" />
    <!-- Front Right Flipper -->
    <path d="M 210 90 C 240 70 270 75 285 95 C 290 115 265 125 225 110 Z" fill="url(#tortGold)" stroke="#b45309" stroke-width="2" />
    <!-- Rear Right Flipper -->
    <path d="M 215 150 C 245 160 260 180 255 195 C 245 205 225 200 205 175 Z" fill="url(#tortGold)" stroke="#b45309" stroke-width="2" />
    
    <!-- Ancient Wise Tortoise Tail -->
    <path d="M 150 195 C 145 215 150 225 155 235 C 158 225 160 215 155 195 Z" fill="url(#tortGold)" />

    <!-- Sacred Tortoise Shell (Mai Rùa Khổng Lồ) -->
    <!-- Outer Rim -->
    <ellipse cx="150" cy="135" rx="75" ry="62" fill="url(#tortGold)" stroke="#78350f" stroke-width="3" />
    <!-- Inner Dome -->
    <ellipse cx="150" cy="135" rx="68" ry="55" fill="url(#tortShell)" stroke="#facc15" stroke-width="2.5" />

    <!-- Bagua Trigrams Carved on Shell -->
    <!-- Hexagonal Plates -->
    <polygon points="150,95 175,110 175,135 150,150 125,135 125,110" fill="none" stroke="#fde047" stroke-width="2.5" />
    <polygon points="150,150 175,165 175,185 150,195 125,185 125,165" fill="none" stroke="#fde047" stroke-width="2" />
    <polygon points="175,110 205,100 218,120 205,145 175,135" fill="none" stroke="#fde047" stroke-width="2" />
    <polygon points="125,110 95,100 82,120 95,145 125,135" fill="none" stroke="#fde047" stroke-width="2" />

    <!-- Center Taiji on the Shell -->
    <circle cx="150" cy="123" r="14" fill="#ffffff" stroke="#b45309" stroke-width="1.5" />
    <path d="M 150 109 A 14 14 0 0 1 150 137 A 7 7 0 0 1 150 123 A 7 7 0 0 0 150 109" fill="#0f172a" />
    <circle cx="150" cy="116" r="2.5" fill="#0f172a" />
    <circle cx="150" cy="130" r="2.5" fill="#ffffff" />

    <!-- Trigrams Symbols on Rim (☰ ☲ ☵ ☷) -->
    <g stroke="#fef08a" stroke-width="1.8" stroke-linecap="round">
      <!-- Top: Kiền ☰ -->
      <line x1="144" y1="84" x2="156" y2="84" />
      <line x1="144" y1="87" x2="156" y2="87" />
      <line x1="144" y1="90" x2="156" y2="90" />
      <!-- Bottom: Khôn ☷ -->
      <line x1="144" y1="187" x2="149" y2="187" /><line x1="151" y1="187" x2="156" y2="187" />
      <line x1="144" y1="190" x2="149" y2="190" /><line x1="151" y1="190" x2="156" y2="190" />
      <line x1="144" y1="193" x2="149" y2="193" /><line x1="151" y1="193" x2="156" y2="193" />
    </g>

    <!-- Celestial Entwined Serpent (Huyền Vũ Thần Xà) -->
    <g fill="none" stroke-linecap="round">
      <path d="M 95 155 C 70 120 105 85 145 80 C 195 75 220 115 195 155 C 180 180 140 175 130 160 C 120 140 140 115 165 115" stroke="url(#serpentGrad)" stroke-width="8" />
      <path d="M 95 155 C 70 120 105 85 145 80 C 195 75 220 115 195 155 C 180 180 140 175 130 160 C 120 140 140 115 165 115" stroke="#93c5fd" stroke-width="3" stroke-dasharray="4,4" />
      <!-- Serpent Head -->
      <g transform="translate(168, 115)">
        <ellipse cx="0" cy="0" rx="7" ry="5" fill="#1e3a8a" />
        <circle cx="2" cy="-2" r="1.5" fill="#facc15" />
        <path d="M6,0 L12,-2 M6,0 L12,2" stroke="#ef4444" stroke-width="1.2" />
      </g>
    </g>

    <!-- Tortoise Neck and Noble Dragon-like Head (Đầu Rùa Vàng Vươn Cao) -->
    <g transform="translate(150, 80)">
      <path d="M-10,0 C-12,-15 -18,-25 -15,-38 C-12,-48 0,-52 12,-48 C20,-42 18,-25 10,0 Z" fill="url(#tortGold)" stroke="#b45309" stroke-width="1.5" />
      <!-- Head -->
      <ellipse cx="0" cy="-45" rx="14" ry="10" fill="url(#tortGold)" stroke="#78350f" stroke-width="1.5" />
      <!-- Snout -->
      <path d="M-6,-48 C-2,-55 2,-55 6,-48 Z" fill="#b45309" />
      <!-- Sacred Pearl in Beak -->
      <circle cx="0" cy="-55" r="4.5" fill="#fde047" stroke="#b45309" stroke-width="1" />
      <!-- Eyes -->
      <circle cx="-6" cy="-45" r="2.5" fill="#450a0a" />
      <circle cx="-7" cy="-46" r="1" fill="#ffffff" />
      <circle cx="6" cy="-45" r="2.5" fill="#450a0a" />
      <circle cx="5" cy="-46" r="1" fill="#ffffff" />
    </g>
  </g>
</svg>